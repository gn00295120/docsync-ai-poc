name: DocSync AI Comment Handler (PoC Replica)
description: |
  Simplified replica of deriv-com/shared-actions docsync_ai_comment.
  Demonstrates: comment body → instruction extraction → file write → git push.
  Skips Anthropic API call (not needed to prove the authorization gap).

inputs:
  comment_body:
    description: The PR comment body
    required: true
  github_token:
    description: Token for git push
    required: true
  pr_number:
    description: PR number
    required: true

runs:
  using: composite
  steps:
    - name: Parse command
      id: parse
      shell: bash
      run: |
        COMMENT_BODY="${{ inputs.comment_body }}"
        # Strip @docbot prefix — same as original line 110
        INSTRUCTION=$(echo "$COMMENT_BODY" | sed 's/^@docbot\s*//')

        # Same logic as original: empty instruction = no-op
        if [ -z "$INSTRUCTION" ]; then
          echo "valid=false" >> $GITHUB_OUTPUT
          echo "command=none" >> $GITHUB_OUTPUT
          echo "No instruction provided — exiting (same as original)"
          exit 0
        fi

        # Check for update command
        if echo "$INSTRUCTION" | grep -qi "^update only readme"; then
          TEXT=$(echo "$INSTRUCTION" | sed 's/^update only readme\s*//')
          echo "valid=true" >> $GITHUB_OUTPUT
          echo "command=update" >> $GITHUB_OUTPUT
          echo "text=$TEXT" >> $GITHUB_OUTPUT
        elif echo "$INSTRUCTION" | grep -qi "^revert"; then
          echo "valid=true" >> $GITHUB_OUTPUT
          echo "command=revert" >> $GITHUB_OUTPUT
        else
          echo "valid=false" >> $GITHUB_OUTPUT
          echo "command=unknown" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Log: no identity check performed (proving CWE-862)
        echo ""
        echo "=== AUTHORIZATION CHECK ==="
        echo "comment_author: N/A"
        echo "author_association: NOT CHECKED"
        echo "Proceeding with command from ANY commenter."

    - name: Write to README and push
      if: steps.parse.outputs.valid == 'true' && steps.parse.outputs.command == 'update'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Append attacker-controlled text to README
        echo "" >> README.md
        echo "## DocSync AI Update" >> README.md
        echo "" >> README.md
        echo "Updated by DocSync AI from PR comment." >> README.md
        echo "Content: ${{ steps.parse.outputs.text }}" >> README.md
        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> README.md

        git add README.md
        git commit -m "docs: DocSync AI update from comment

Automated by DocSync AI
Comment author association: NOT CHECKED (CWE-862 PoC)"

        git push origin HEAD

        echo ""
        echo "=== TERMINAL IMPACT ==="
        echo "Commit pushed to branch by an unauthenticated commenter."
        echo "In the original workflow, this uses DOCSYNC_GITHUB_TOKEN (PAT)."
        echo "This PoC uses the default GITHUB_TOKEN to demonstrate the same path."
