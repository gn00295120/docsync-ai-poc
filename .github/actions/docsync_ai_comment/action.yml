name: DocSync AI Comment Handler (PoC Replica)
description: Simplified replica proving the authorization gap

inputs:
  comment_body:
    description: The PR comment body
    required: true
  github_token:
    description: Token for git push
    required: true
  pr_number:
    description: PR number
    required: true

runs:
  using: composite
  steps:
    - name: Parse command
      id: parse
      shell: bash
      env:
        COMMENT_BODY: ${{ inputs.comment_body }}
      run: |
        # Strip @docbot prefix — same as original line 110
        INSTRUCTION=$(echo "$COMMENT_BODY" | sed 's/^@docbot[[:space:]]*//')

        if [ -z "$INSTRUCTION" ]; then
          echo "valid=false" >> $GITHUB_OUTPUT
          echo "command=none" >> $GITHUB_OUTPUT
          echo "No instruction — exiting (same as original)"
          exit 0
        fi

        if echo "$INSTRUCTION" | grep -qi "^update only readme"; then
          TEXT=$(echo "$INSTRUCTION" | sed 's/^update only readme[[:space:]]*//')
          echo "valid=true" >> $GITHUB_OUTPUT
          echo "command=update" >> $GITHUB_OUTPUT
          # Save text to file to avoid YAML injection
          echo "$TEXT" > /tmp/docbot-text.txt
        else
          echo "valid=false" >> $GITHUB_OUTPUT
          echo "command=unknown" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo ""
        echo "=== AUTHORIZATION CHECK ==="
        echo "comment_author: N/A (NOT CHECKED — CWE-862)"
        echo "author_association: NOT CHECKED"

    - name: Write to README and push
      if: steps.parse.outputs.valid == 'true' && steps.parse.outputs.command == 'update'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        TEXT=$(cat /tmp/docbot-text.txt 2>/dev/null || echo "(no text)")

        echo "" >> README.md
        echo "## DocSync AI Update" >> README.md
        echo "" >> README.md
        echo "Updated by DocSync AI from PR comment." >> README.md
        echo "Content: $TEXT" >> README.md
        echo "Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> README.md

        git add README.md
        git commit -m "docs: DocSync AI update from comment (CWE-862 PoC)"
        git push origin HEAD

        echo ""
        echo "=== TERMINAL IMPACT ==="
        echo "Commit pushed to branch by a commenter with NO identity verification."
