name: DocSync AI — Documentation Sync (PoC Replica)
# Replicates deriv-com/deriv-smartcharts DocSyncAI.yml
# Key: the only gate is startsWith(comment.body, '@docbot') — no actor check

on:
  issue_comment:
    types: [created]

jobs:
  docsync-comment:
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '@docbot')
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Acknowledge Comment with 👍
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1'
            });

      - name: Log commenter info (PoC — showing no check happens)
        run: |
          echo "=== DocSync AI PoC ==="
          echo "Comment author: ${{ github.actor }}"
          echo "Author association: ${{ github.event.comment.author_association }}"
          echo "Comment body: ${{ github.event.comment.body }}"
          echo ""
          echo "NOTE: This job runs for ANY commenter."
          echo "The original deriv-com workflow does NOT check author_association."
          echo "It would proceed to checkout, Anthropic API call, and git push."

      - name: Resolve PR head ref
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('head_sha', pr.data.head.sha);
            console.log(`PR #${context.issue.number} head ref: ${pr.data.head.ref}`);

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Execute docbot command (simplified — no Anthropic API)
        uses: ./.github/actions/docsync_ai_comment
        with:
          comment_body: ${{ github.event.comment.body }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.issue.number }}
